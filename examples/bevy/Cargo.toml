[package]
name = "pixel-sync-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
default = ["viewer"]
viewer = ["bevy/2d_bevy_render", "bevy/bevy_winit", "bevy/x11"]

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_image", "bevy_sprite", "bevy_log", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
