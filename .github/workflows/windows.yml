name: Windows editor
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run smoke:editor
      - run: bun run package
      - run: bun run smoke:packaged
      - run: bun run make
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-editor-windows-unsigned
          path: out/make/**/*
